name: Return Current EM

on:
  pull_request:
    paths:
      - .github/workflows/return-current-em.yml
      - cli/simulate/**
      - tests/cli/simulate/return-current.test.ts
      - tests/cli/simulate/__snapshots__/return-current*
      - scripts/bun-build.ts
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  return-current-em:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TSCI_RUN_RETURN_CURRENT_EM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Gmsh and VTK system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa libgl1 libgomp1
      - run: bun install --frozen-lockfile
      - name: Setup Palace Python environment
        run: |
          bun -e '
            import { appendFile } from "node:fs/promises";
            import { setupPalacePython } from "simulate-return-current/palace";
            const python = await setupPalacePython({
              directory: `${process.env.RUNNER_TEMP}/return-current-python`,
            });
            await appendFile(process.env.GITHUB_ENV, `PALACE_PYTHON=${python}\n`);
          '
      - name: Pull pinned Palace solver
        run: docker pull benvial/palace@sha256:f0f3a3cbbdf1ee2d8f856ddbe1f5bf4628a92ee8ab87d1e27dc33402ad9c8dda
      # Runs the same container as simulate-return-current, keeping the solver
      # output outside the test's temporary directory so failures are visible.
      - name: Keep Palace output for failures
        run: |
          cat > "$RUNNER_TEMP/palace" <<'SCRIPT'
          #!/usr/bin/env bash
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/palace-case"
          cp -r . "$RUNNER_TEMP/palace-case/"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/case" --workdir /case \
            benvial/palace@sha256:f0f3a3cbbdf1ee2d8f856ddbe1f5bf4628a92ee8ab87d1e27dc33402ad9c8dda \
            palace "$@" 2>&1 | tee -a "$RUNNER_TEMP/palace-output.log"
          SCRIPT
          chmod +x "$RUNNER_TEMP/palace"
          echo "PALACE_BIN=$RUNNER_TEMP/palace" >> "$GITHUB_ENV"
      - name: Run fresh EM solve and compare SVG snapshot
        env:
          TSCIRCUIT_CONFIG_DIR: ${{ runner.temp }}/return-current-config
        run: bun test tests/cli/simulate/return-current.test.ts
      - name: Print EM environment and Palace output
        if: always()
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Flags" | cut -c1-400
          uname -r
          docker version --format 'docker {{.Server.Version}}'
          cd "$RUNNER_TEMP/palace-case" && find . -type f ! -name '*.log' | sort | xargs sha256sum
          grep -E "elements|vertices|libCEED backend|singular|Elapsed" "$RUNNER_TEMP/palace-output.log" || true
          tail -n 20 "$RUNNER_TEMP/palace-output.log"
      - name: Try Palace solver variants on the saved case
        if: always()
        run: |
          IMAGE=benvial/palace@sha256:f0f3a3cbbdf1ee2d8f856ddbe1f5bf4628a92ee8ab87d1e27dc33402ad9c8dda
          for variant in baseline ref_backend pc_shifted ref_backend+pc_shifted; do
            dir="$RUNNER_TEMP/variant-$variant"
            rm -rf "$dir" && cp -r "$RUNNER_TEMP/palace-case" "$dir"
            python3 - "$dir/palace.json" "$variant" <<'PY'
          import json, sys
          path, variant = sys.argv[1], sys.argv[2]
          config = json.load(open(path))
          if "ref_backend" in variant:
              config["Solver"]["Backend"] = "/cpu/self/ref/serial"
          if "pc_shifted" in variant:
              config["Solver"]["Linear"]["PCMatShifted"] = True
          json.dump(config, open(path, "w"))
          PY
            status=0
            docker run --rm --network none --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$dir,dst=/case" --workdir /case "$IMAGE" \
              palace -np 1 palace.json > "$dir/variant.log" 2>&1 || status=$?
            echo "VARIANT $variant exit=$status $(grep -m1 -o 'singular matrix' "$dir/variant.log")"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: return-current-snapshot-diff
          path: tests/cli/simulate/__snapshots__/return-current*
