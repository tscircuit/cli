name: Check SysConfig export branch
on:
  push:
    branches: [add-sysconfig-export]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Record existing compiler dependency mismatch
        run: |
          bun -e 'const p = await import("@tscircuit/props"); console.log("assemblySubassemblyProps:", "assemblySubassemblyProps" in p); console.log("props version:", (await Bun.file("node_modules/@tscircuit/props/package.json").json()).version); console.log("tscircuit manifest:", await Bun.file("node_modules/tscircuit/package.json").text())'
          set +e
          bun test tests/cli/export/export-altium.test.ts
          result=$?
          echo "Existing Altium test exit=$result"
          exit 0
      - name: Test compatible props without changing the remote branch
        run: bun add --dev --exact @tscircuit/props@0.0.672
      - name: Check TypeScript
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Check formatting
        id: format
        continue-on-error: true
        run: bun run format:check
      - name: Test real converter and JSON/TSX commands
        id: tests
        continue-on-error: true
        run: bun test tests/lib/sysconfig-export.test.ts tests/cli/export/export-sysconfig.test.ts
      - name: Build bundled CLI
        id: build
        continue-on-error: true
        run: bun run build
      - name: Record experimental dependency diff
        if: always()
        run: git diff --stat && git diff -- package.json
      - name: Require all experiment checks
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'Typecheck=%s Format=%s Tests=%s Build=%s\n' "$TYPECHECK" "$FORMAT" "$TESTS" "$BUILD"
          test "$TYPECHECK" = success
          test "$FORMAT" = success
          test "$TESTS" = success
          test "$BUILD" = success
