name: Check SysConfig export branch
on:
  push:
    branches: [add-sysconfig-export]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Check TypeScript
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit
      - name: Check formatting
        id: format
        continue-on-error: true
        run: bun run format:check
      - name: Test real converter and JSON/TSX commands
        id: tests
        continue-on-error: true
        run: bun test tests/lib/sysconfig-export.test.ts tests/cli/export/export-sysconfig.test.ts
      - name: Build the bundled CLI
        id: build
        continue-on-error: true
        run: bun run build
      - name: Require all checks to pass
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          printf 'Typecheck=%s Format=%s Tests=%s Build=%s\n' "$TYPECHECK" "$FORMAT" "$TESTS" "$BUILD"
          test "$TYPECHECK" = success
          test "$FORMAT" = success
          test "$TESTS" = success
          test "$BUILD" = success
