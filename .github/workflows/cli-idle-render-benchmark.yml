name: CLI idle render comparison
on:
  pull_request:
  workflow_dispatch:
jobs:
  compare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Compare identical delayed native routing on base and head
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE_SHA:-HEAD~1}"
          git worktree add --detach "$RUNNER_TEMP/idle-base" "$base"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/idle-base/node_modules"
          mkdir -p "$RUNNER_TEMP/idle-base/scripts" "$RUNNER_TEMP/idle-base/tests/fixtures" comparison
          cp scripts/benchmark-cli-idle-render-polls.ts "$RUNNER_TEMP/idle-base/scripts/"
          cp tests/fixtures/delayed-native-routing.circuit.tsx "$RUNNER_TEMP/idle-base/tests/fixtures/"
          for count in 2 128 512; do
            (cd "$RUNNER_TEMP/idle-base" && bun scripts/benchmark-cli-idle-render-polls.ts "$count" "$GITHUB_WORKSPACE/comparison/base-$count.json") > "comparison/base-$count.log"
            bun scripts/benchmark-cli-idle-render-polls.ts "$count" "comparison/head-$count.json" > "comparison/head-$count.log"
          done
          (cd "$RUNNER_TEMP/idle-base" && bun scripts/benchmark-cli-idle-render-polls.ts 2 "$GITHUB_WORKSPACE/comparison/base-immediate.json" --immediate) > comparison/base-immediate.log
          bun scripts/benchmark-cli-idle-render-polls.ts 2 comparison/head-immediate.json --immediate > comparison/head-immediate.log
          python3 - <<'PYCODE' 
          import json
          from pathlib import Path
          for count in [2,128,512,'immediate']:
            a=json.loads(Path(f'comparison/base-{count}.json').read_text());b=json.loads(Path(f'comparison/head-{count}.json').read_text())
            for x,y in zip(a['trials'],b['trials']):
              for k in ['components','inputSha256','nativeCopperSha256','traceCount','viaCount','errorCount','statuses']:assert x[k]==y[k],(count,k,x[k],y[k])
              assert x['traceCount']>0 and x['errorCount']==0 and y['errorCount']==0
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-idle-render-comparison
          path: comparison
