name: Bun Test

on:
  pull_request:
  push:
    branches:
      - main
      - '!version-bumps/**'

jobs:
  standalone-test-assets:
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'chore: bump version' }}"
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run build:browser-modules
      # Use the paired RunFrame implementation until it is released to npm.
      - uses: actions/checkout@v4
        with:
          repository: tscircuit/runframe
          ref: f106df3493d3537313255a0937f232a47f33cb48
          path: ci-test-assets/runframe-source
      - run: bun install
        working-directory: ci-test-assets/runframe-source
      - run: bun run build:css && bun run build:standalone
        working-directory: ci-test-assets/runframe-source
      - run: bun run scripts/prepare-test-runframe.ts ci-test-assets/runframe-source ci-test-assets/runframe-standalone.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-test-assets
          path: |
            dist/jscdn
            ci-test-assets/runframe-standalone.min.js
          retention-days: 3

  test:
    needs: standalone-test-assets
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'pull_request' || github.event.pull_request.title != 'chore: bump version' }}"
    timeout-minutes: 20
    strategy:
      matrix:
        node: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/bun.lockb', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: bun install

      - uses: actions/download-artifact@v4
        with:
          name: standalone-test-assets
          path: .
      - name: Select paired RunFrame for browser integration tests
        run: |
          cp node_modules/@tscircuit/runframe/dist/standalone.min.js ci-test-assets/npm-runframe-standalone.min.js
          cp ci-test-assets/runframe-standalone.min.js node_modules/@tscircuit/runframe/dist/standalone.min.js
      
      - run: bunx playwright install chromium

      - name: Generate test plans
        run: bun run scripts/generate-test-plan.ts

      - name: Run tests for node ${{ matrix.node }}
        run: |
          if [ ! -f ".github/test-plans/node${{ matrix.node }}-testplan.txt" ]; then
            echo "ERROR: No test plan found for node ${{ matrix.node }}"
            exit 1
          fi

          mapfile -t test_files < .github/test-plans/node${{ matrix.node }}-testplan.txt
          if [ ${#test_files[@]} -eq 0 ]; then
            echo "ERROR: No test files in plan for node ${{ matrix.node }}"
            exit 1
          fi

          echo "Running ${#test_files[@]} test files for node ${{ matrix.node }}"
          bun run scripts/run-tests-with-retry.ts --timeout 30000 "${test_files[@]}"

      - name: Restore npm RunFrame before dependency caching
        if: always()
        run: |
          if [ -f ci-test-assets/npm-runframe-standalone.min.js ]; then
            cp ci-test-assets/npm-runframe-standalone.min.js node_modules/@tscircuit/runframe/dist/standalone.min.js
          fi

      - name: Upload Snapshot Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-node${{ matrix.node }}
          path: |
            tests/**/__snapshots__/*.diff.png
            tests/**/__snapshots__/*.snap.png
          if-no-files-found: ignore
